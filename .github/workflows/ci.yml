name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".omo/**"
      - ".forge-standard/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".omo/**"
      - ".forge-standard/**"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Install MCP deps
        run: npm ci --prefix mcp

      - name: Typecheck MCP
        run: ./mcp/node_modules/.bin/tsc --noEmit -p mcp/tsconfig.json

      # mcp/dist is a build artifact and no longer committed, so the vitest suite
      # (which spawns dist/server.js) needs an explicit build first.
      - name: Build MCP server
        run: npm run build --prefix mcp

      - name: Shellcheck scripts (bash -n)
        run: |
          shopt -s nullglob
          for f in scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Run tests (28 tests)
        run: npm test

      - name: Stdio smoke — GITHUB_WORKSPACE
        run: bash examples/stdio-smoke.sh --workdir "$GITHUB_WORKSPACE"

      - name: Stdio smoke — path with spaces
        run: bash examples/stdio-smoke.sh --workdir "/tmp/with spaces/ci smoke"

      - name: MCP client — GITHUB_WORKSPACE
        run: node examples/mcp-client.js --workdir "$GITHUB_WORKSPACE"

      - name: MCP client — path with spaces
        run: node examples/mcp-client.js --workdir "/tmp/with spaces/ci smoke"

      # Manual gate for archive/release requiring admin — do not automate secrets.GITHUB_TOKEN archive:
      # To archive legacies or create a GitHub Release after canonical is verified live:
      #   gh repo archive SriChandraSekharA/anvil-review-loop  # requires admin
      #   gh repo archive SriChandraSekharA/qodo-standard-review  # requires admin
      #   gh release create v1.0.0 --title "v1.0.0" --notes "see CHANGELOG"  # requires contents:write + admin
      # These are intentionally NOT in CI; run manually after skills.sh propagation confirmed.

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: "Run pytest suite (repo policy: uv for Python, never pip)"
        run: uv run --with pytest pytest tests/ -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # shellcheck-clean for all loop scripts; poll-skills.sh is ops-only and exempt.
      - name: Shellcheck scripts
        run: |
          shopt -s nullglob
          for f in scripts/*.sh; do
            case "$f" in scripts/poll-skills.sh) continue ;; esac
            echo "checking $f"
            shellcheck "$f"
          done
